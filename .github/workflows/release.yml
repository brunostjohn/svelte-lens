name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm with trusted-publishing support
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Read and verify release metadata
        id: package
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Pack npm package
        run: pnpm --filter svelte-lens-vite pack --pack-destination "$RUNNER_TEMP"

      - name: Package Chrome extension
        working-directory: apps/extension/dist
        run: zip -q -r "$RUNNER_TEMP/svelte-lens-chrome-${{ steps.package.outputs.version }}.zip" .

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: svelte-lens-${{ steps.package.outputs.version }}
          path: |
            ${{ runner.temp }}/svelte-lens-vite-${{ steps.package.outputs.version }}.tgz
            ${{ runner.temp }}/svelte-lens-chrome-${{ steps.package.outputs.version }}.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish npm package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm with trusted-publishing support
        run: npm install --global npm@11.16.0

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: svelte-lens-${{ needs.build.outputs.version }}
          path: release

      - name: Publish npm package
        run: npm publish "release/svelte-lens-vite-${{ needs.build.outputs.version }}.tgz" --access public
